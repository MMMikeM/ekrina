# Its own pnpm root, so the site's dependencies never reach the library's
# lockfile or the `pnpm audit` in its release gate.
allowBuilds:
  esbuild: true
  # Its postinstall only fetches the per-platform binary when the optional
  # dependency that already provides it is missing.
  workerd: false

# 7 days, as in the library root
minimumReleaseAge: 10080

# The reference generator needs TypeScript 7.1's programmatic API, only
# published as a beta so far. Its per-platform compiler binaries can't take a
# version in a name pattern, but typescript pins them to its own exact version.
minimumReleaseAgeExclude:
  - typescript@7.1.0-beta
  - "@typescript/typescript-*"

# Mirrors the library root's security overrides, which don't reach a separate
# pnpm root.
overrides:
  nanoid@<3.3.18: ^3.3.18
  source-map-js@<1.2.2: ^1.2.2
  tinypool@<2.1.2: ~2.1.2
  # GHSA-rj75-hqrm-r3gf: expressive-code 0.44.3 moves to postcss-nested 7 for
  # the same fix.
  postcss-nested@<7: ^7.0.2
