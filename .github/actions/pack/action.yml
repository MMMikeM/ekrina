name: Pack
description: Install, build and pack the package, and upload the tarball as the `package` artifact.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        cache: pnpm
    - run: pnpm install --frozen-lockfile --filter '!ekrina-docs'
      shell: bash
    - run: pnpm vpr build && pnpm pack
      shell: bash
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: package
        path: ekrina-*.tgz
        if-no-files-found: error
