name: Docs

on:
  # When the maintainer publishes a release's draft, after approving it on npm:
  # the site describes what `npm install` gives, so neither main, a prerelease,
  # nor a release still awaiting approval deploys.
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release's tag, not main's tip.
          ref: ${{ github.event.release.tag_name || github.sha }}
          # The build runs third-party build scripts; keep the token out of .git/config.
          persist-credentials: false
          # Full history, for each page's last-updated date.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      # Its build copies the bench's pages from docs/ and generates the API
      # reference from ../src before running astro build.
      - run: pnpm install --frozen-lockfile --filter ekrina-docs
      - run: pnpm --dir site run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: site/dist
          retention-days: 1

  # Only the deploy job holds the Cloudflare token: the build job runs
  # third-party build scripts, and this one installs with scripts off.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cloudflare
      url: https://ekrina.thelazyweb.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter ekrina-docs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: site/dist
      - run: pnpm --dir site exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # After the deploy, so the engines crawl what just went live. The site is
      # already up either way, so a failed ping only warns.
      - run: node site/scripts/indexnow.ts
        continue-on-error: true
