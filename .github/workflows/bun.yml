name: Bun

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# The packed tarball, not the source, as an installer would get it.
jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pack

  smoke:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: bun latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/smoke
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - run: tar xzf ekrina-*.tgz
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun .github/smoke/smoke.mjs && bun .github/smoke/smoke.cjs
