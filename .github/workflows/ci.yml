name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate
      - run: pnpm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ekrina-*.tgz
          if-no-files-found: error

  # The packed tarball, not the source, in every runtime the README names.
  runtimes:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: node, version: "18" }
          - { runtime: node, version: "20" }
          - { runtime: node, version: "22" }
          - { runtime: node, version: "24" }
          - { runtime: bun, version: latest }
          - { runtime: deno, version: v2.x }
    name: ${{ matrix.runtime }} ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/smoke
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - run: tar xzf ekrina-*.tgz
      - if: matrix.runtime == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.version }}
      - if: matrix.runtime == 'node'
        run: node .github/smoke/smoke.mjs && node .github/smoke/smoke.cjs
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.version }}
      - if: matrix.runtime == 'bun'
        run: bun .github/smoke/smoke.mjs && bun .github/smoke/smoke.cjs
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.version }}
      - if: matrix.runtime == 'deno'
        run: deno run --allow-read .github/smoke/smoke.mjs
