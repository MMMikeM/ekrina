<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 524" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pareto-query-title pareto-query-desc">
  <title id="pareto-query-title">Fuzzy search libraries: MRR vs per-query time across a 24-query session</title>
  <desc id="pareto-query-desc">Scatter plot of 15 configurations of eight JavaScript fuzzy search libraries comparing MRR (how highly each ranks the queried item) against query milliseconds with indexes prebuilt, on a log scale, on the mixed 10k corpus over 24 probes. The Pareto frontier runs uFuzzy (0.24 MRR at 0.24 ms) to fuzzysort (0.64 MRR at 0.54 ms) to Ekrina (indexed) (0.87 MRR at 0.55 ms) to Ekrina (acronym) (0.90 MRR at 0.77 ms). Ekrina owns the accurate end of the frontier; the faster points on it are markedly less accurate, and every other configuration, including Fuse.js, is dominated.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="524" fill="#1a1a19"/>
  <text x="66" y="28" fill="#ffffff" font-size="18" font-weight="600">Ranking quality vs. per-query session time</text>
  <text x="66" y="47" fill="#c3c2b7" font-size="13">MRR over 24 probes · mixed 10k corpus · one searcher, all probes once (batch)</text>
