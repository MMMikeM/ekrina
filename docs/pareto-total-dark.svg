<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 524" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pareto-total-title pareto-total-desc">
  <title id="pareto-total-title">Fuzzy search libraries: MRR vs cold one-shot cost</title>
  <desc id="pareto-total-desc">Scatter plot of 15 configurations of eight JavaScript fuzzy search libraries comparing MRR (how highly each ranks the queried item) against total milliseconds for one cold search (index build plus the first, cold query), on a log scale, on the mixed 10k corpus over 24 probes. The Pareto frontier runs fuzzy (0.43 MRR at 2.18 ms) to Ekrina (indexed) (0.87 MRR at 3.63 ms) to Ekrina (acronym) (0.90 MRR at 4.17 ms). The no-index engines own the cheapest cold one-shots; base Ekrina and Ekrina (acronym) share a near-zero build and differ only in query time, Ekrina (indexed) moves the mask build into construction and still comes out cheaper than both, fuzzysort's prepare-all pass lands in its cold query and moves it off this frontier, and Fuse.js is dominated.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
  </defs>
