<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 524" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pareto-query-title pareto-query-desc">
  <title id="pareto-query-title">Fuzzy search libraries: MRR vs per-query cost across a 20-query session</title>
  <desc id="pareto-query-desc">Scatter plot of 15 configurations of eight JavaScript fuzzy search libraries comparing MRR (how highly each ranks the queried item) against query milliseconds with indexes prebuilt, on a log scale, on the mixed 10k corpus over 20 probes. The Pareto frontier runs uFuzzy (0.11 MRR at 0.19 ms) to fuzzysort (0.42 MRR at 0.30 ms) to Ekrina (indexed) (0.84 MRR at 0.37 ms) to Ekrina (acronym) (0.87 MRR at 0.57 ms). Ekrina owns the accurate end of the frontier; the cheaper points on it are markedly less accurate, and every other configuration, including Fuse.js, is dominated.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
  </defs>
